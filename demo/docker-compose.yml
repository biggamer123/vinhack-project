name: inkwell

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api

  web:
    build: ./web
    depends_on:
      - api

  api:
    build: .
    environment:
      DATABASE_URL: postgres://inkwell:inkwell-dev-password@postgres:5432/inkwell
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017/inkwell
      SESSION_TTL_HOURS: "72"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started

  mailer:
    build: ./services/mailer
    environment:
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit:1025
    depends_on:
      - redis
      - mailpit

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: inkwell
      POSTGRES_PASSWORD: inkwell-dev-password
      POSTGRES_DB: inkwell
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwell"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  mongo:
    image: mongo:7

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  pgdata:
